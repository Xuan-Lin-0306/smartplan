<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartPlan｜智慧任務規劃助手</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#302b43;background:#f7f5fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:32px 20px 70px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}.brand{font-size:28px;font-weight:850;color:#7256b6}.brand span{color:#b29adf}h1{font-size:27px;margin:0 0 8px}h2{font-size:19px;margin:0 0 18px}.sub,.muted{color:#817b91}.sub{margin:0 0 26px}.panel,.stat{background:white;border:1px solid #ebe6f5;border-radius:20px;padding:22px;box-shadow:0 7px 24px #5e48800a}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat small{display:block;color:#817b91;margin-bottom:8px}.stat strong{font-size:29px;color:#65509f}.layout{display:grid;grid-template-columns:350px 1fr;gap:20px;align-items:start}.stack{display:grid;gap:20px}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:12px;border:1px solid #ded7ed;border-radius:11px;background:#fff;color:#302b43;font:inherit;min-width:0}input:focus,select:focus{outline:2px solid #ad96df}form{display:grid;gap:13px}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 15px;font-weight:700}.primary{background:#785ac2;color:white}.primary:hover{background:#6545b1}.ghost{background:#f0ebfa;color:#6b50aa}.danger{background:#fff0f1;color:#a9475b}.tools{display:grid;grid-template-columns:1fr 160px;gap:10px;margin-bottom:14px}.task{border:1px solid #eee8f5;border-radius:13px;padding:13px;margin-top:10px;display:flex;align-items:flex-start;gap:10px;background:#fff}.task.done{opacity:.58}.task.done .taskname{text-decoration:line-through}.task input[type=checkbox]{width:18px;height:18px;accent-color:#785ac2;margin-top:3px;flex-shrink:0}.taskbody{flex:1;min-width:0}.taskname{font-weight:750;overflow-wrap:anywhere}.meta{font-size:12px;color:#817b91;margin-top:6px}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.actions button{padding:5px 9px;font-size:12px}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#f0ebfa;color:#6b50aa;font-size:11px;margin-left:6px}.overdue{color:#b44256}.matrix{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.quadrant{border-radius:15px;padding:14px;min-height:155px}.q0{background:#fff0ef}.q1{background:#edf3ff}.q2{background:#fff5e7}.q3{background:#edf8f1}.quadrant h3{font-size:14px;margin:0 0 10px}.mini{background:#ffffffc9;padding:9px;border-radius:9px;margin:7px 0;font-size:12px;overflow-wrap:anywhere}.progress{height:12px;background:#eee9f5;border-radius:20px;overflow:hidden}.bar{height:100%;background:#9376d5;transition:width .25s}.empty{color:#958ca5;text-align:center;padding:20px 8px;font-size:13px}.hint{font-size:12px;color:#817b91;line-height:1.7}footer{text-align:center;color:#9a92a8;margin-top:30px;font-size:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.wrap{padding:20px 12px 50px}.panel{padding:16px}.tools,.matrix{grid-template-columns:1fr}.brand{font-size:24px}.stat{padding:14px}.stat strong{font-size:24px}}
</style>
</head>
<body><div class="wrap"><header><div class="brand">✦ Smart<span>Plan</span></div><span class="muted">把重要的事，安排得剛剛好 ✨</span></header><h1>我的智慧任務儀表板</h1><p class="sub">告別雜亂待辦，讓每一天更有方向。</p>
<section class="stats"><div class="stat"><small>全部任務</small><strong id="total">0</strong></div><div class="stat"><small>待完成</small><strong id="pending">0</strong></div><div class="stat"><small>緊急待辦</small><strong id="urgent">0</strong></div><div class="stat"><small>完成率</small><strong id="rate">0%</strong></div></section>
<div class="layout"><aside class="stack"><section class="panel"><h2 id="formTitle">＋ 新增任務</h2><form id="taskForm"><div><label for="name">任務名稱 *</label><input id="name" maxlength="100" required placeholder="例如：完成期末報告"></div><div class="row2"><div><label for="category">任務分類</label><select id="category"><option>課業</option><option>考試</option><option>專題研究</option><option>生活</option><option>其他</option></select></div><div><label for="important">重要程度</label><select id="important"><option value="true">重要</option><option value="false">不重要</option></select></div></div><div class="row2"><div><label for="deadline">截止日期 *</label><input id="deadline" type="date" required></div><div><label for="hours">預估時間（小時）</label><input id="hours" type="number" min="0.5" max="999" step="0.5" value="1" required></div></div><button class="primary" id="submitBtn" type="submit">新增任務</button><button class="ghost" type="button" id="cancelEdit" hidden>取消編輯</button></form></section><section class="panel"><h2>📈 完成進度</h2><div class="progress"><div id="progressBar" class="bar" style="width:0%"></div></div><p class="hint" id="progressText">還沒有任務，從新增第一項開始吧！</p><p class="hint">分類規則：截止日距今 3 天內（包含逾期）視為緊急；重要程度由你設定。資料僅保存在目前瀏覽器。</p></section></aside>
<main class="stack"><section class="panel"><h2>📋 我的任務清單</h2><div class="tools"><input id="search" aria-label="搜尋任務" placeholder="🔎 搜尋任務名稱..."><select id="filter" aria-label="篩選任務"><option value="all">全部任務</option><option value="pending">待完成</option><option value="done">已完成</option><option value="urgent">緊急待辦</option><option value="課業">課業</option><option value="考試">考試</option><option value="專題研究">專題研究</option><option value="生活">生活</option><option value="其他">其他</option></select></div><div id="taskList" aria-live="polite"></div></section><section class="panel"><h2>🧭 艾森豪四象限</h2><div class="matrix" id="matrix"></div></section></main></div><footer>SmartPlan · Vibe Coding Project · 單檔案前端作品</footer></div>
<script>
'use strict';
const KEY='smartplan.tasks.v1';let tasks=[];let editingId=null;
const $=id=>document.getElementById(id);
function load(){try{const v=JSON.parse(localStorage.getItem(KEY)||'[]');tasks=Array.isArray(v)?v.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(x.deadline)):[];}catch{tasks=[];}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks));}catch{alert('瀏覽器無法保存資料，請檢查儲存空間或隱私模式。');}}
function dayDiff(date){const d=new Date(date+'T12:00:00');const now=new Date();const today=new Date(now.getFullYear(),now.getMonth(),now.getDate(),12);return Math.round((d-today)/86400000)}
function quadrant(t){const urgent=dayDiff(t.deadline)<=3;return t.important?(urgent?0:1):(urgent?2:3)}
const labels=['重要且緊急 · 立即處理','重要但不緊急 · 提前規劃','不重要但緊急 · 適當安排','不重要且不緊急 · 有空再做'];
function dateText(t){const d=dayDiff(t.deadline);return d<0?`已逾期 ${-d} 天`:d===0?'今天截止':d===1?'明天截止':`剩餘 ${d} 天`}
function el(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}
function resetForm(){$('taskForm').reset();$('hours').value='1';$('formTitle').textContent='＋ 新增任務';$('submitBtn').textContent='新增任務';$('cancelEdit').hidden=true;editingId=null}
function render(){const pending=tasks.filter(t=>!t.done);const completed=tasks.length-pending.length;const rate=tasks.length?Math.round(completed/tasks.length*100):0;$('total').textContent=tasks.length;$('pending').textContent=pending.length;$('urgent').textContent=pending.filter(t=>dayDiff(t.deadline)<=3).length;$('rate').textContent=rate+'%';$('progressBar').style.width=rate+'%';$('progressText').textContent=tasks.length?`已完成 ${completed} / ${tasks.length} 項任務，繼續加油！`:'還沒有任務，從新增第一項開始吧！';
const term=$('search').value.trim().toLocaleLowerCase();const f=$('filter').value;const visible=tasks.filter(t=>t.name.toLocaleLowerCase().includes(term)&&(f==='all'||(f==='pending'&&!t.done)||(f==='done'&&t.done)||(f==='urgent'&&!t.done&&dayDiff(t.deadline)<=3)||t.category===f)).sort((a,b)=>Number(a.done)-Number(b.done)||quadrant(a)-quadrant(b)||a.deadline.localeCompare(b.deadline));const list=$('taskList');list.replaceChildren();if(!visible.length)list.append(el('div','empty','目前沒有符合條件的任務。'));
visible.forEach(t=>{const card=el('div','task'+(t.done?' done':''));const check=el('input');check.type='checkbox';check.checked=!!t.done;check.setAttribute('aria-label','完成 '+t.name);check.addEventListener('change',()=>{t.done=check.checked;save();render()});const body=el('div','taskbody');const title=el('div','taskname',t.name);title.append(el('span','pill',t.category));const meta=el('div','meta',`${dateText(t)} · ${t.deadline} · ${t.hours} 小時 · ${labels[quadrant(t)].split(' · ')[0]}`);if(dayDiff(t.deadline)<0&&!t.done)meta.classList.add('overdue');const actions=el('div','actions');const edit=el('button','ghost','編輯');edit.addEventListener('click',()=>{editingId=t.id;$('name').value=t.name;$('category').value=t.category;$('important').value=String(t.important);$('deadline').value=t.deadline;$('hours').value=t.hours;$('formTitle').textContent='✎ 編輯任務';$('submitBtn').textContent='儲存修改';$('cancelEdit').hidden=false;$('name').focus();window.scrollTo({top:0,behavior:'smooth'})});const del=el('button','danger','刪除');del.addEventListener('click',()=>{if(confirm(`確定刪除「${t.name}」？`)){tasks=tasks.filter(x=>x.id!==t.id);if(editingId===t.id)resetForm();save();render()}});actions.append(edit,del);body.append(title,meta,actions);card.append(check,body);list.append(card)});
const matrix=$('matrix');matrix.replaceChildren();labels.forEach((label,i)=>{const box=el('div','quadrant q'+i);box.append(el('h3','',`${i+1}. ${label}`));const items=pending.filter(t=>quadrant(t)===i).sort((a,b)=>a.deadline.localeCompare(b.deadline));if(!items.length)box.append(el('div','empty','暫無待辦'));items.forEach(t=>box.append(el('div','mini',`${t.name} · ${dateText(t)}`)));matrix.append(box)})}
$('taskForm').addEventListener('submit',e=>{e.preventDefault();const name=$('name').value.trim(),deadline=$('deadline').value,hours=Number($('hours').value);if(!name||!/^\d{4}-\d{2}-\d{2}$/.test(deadline)||!Number.isFinite(hours)||hours<0.5||hours>999){alert('請填寫有效的任務名稱、日期與預估時間。');return}const old=tasks.find(t=>t.id===editingId);const data={id:old?.id||((typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():String(Date.now())+'-'+Math.random()),name,category:$('category').value,important:$('important').value==='true',deadline,hours,done:old?.done||false};if(old)Object.assign(old,data);else tasks.push(data);save();resetForm();render()});$('cancelEdit').addEventListener('click',resetForm);$('search').addEventListener('input',render);$('filter').addEventListener('change',render);load();render();
</script></body></html>
